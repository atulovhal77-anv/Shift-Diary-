<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Shift Diary</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fbf">
<link rel="icon" type="image/png" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#17202b;--mute:#5d6b7a;--line:#d9dee5;--a:#1f5fbf;--on-a:#fff;--ot:#b4570a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#1a232d;--ink:#eaf0f6;--mute:#93a1b0;--line:#2c3947;--a:#6aa4ff;--on-a:#0b1522;--ot:#ffb066}}
:root[data-theme="dark"]{--bg:#10161d;--card:#1a232d;--ink:#eaf0f6;--mute:#93a1b0;--line:#2c3947;--a:#6aa4ff;--on-a:#0b1522;--ot:#ffb066}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Noto Sans Devanagari",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 12px 40px}
h1{font-size:21px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mu{color:var(--mute);font-size:13px}.big{font-size:36px;font-weight:800;color:var(--a);line-height:1.15}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;padding:9px 4px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:600}
.seg button.on,.lang button.on{background:var(--a);color:var(--on-a);border-color:var(--a)}
.lang{display:flex;gap:4px}.lang button{padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 110px}
.stat small{display:block;color:var(--mute);font-size:13px}.stat b{font-size:18px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input[type=color]{height:42px;padding:2px}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mn button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:22px;padding:2px 14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wd{text-align:center;font-size:12px;color:var(--mute)}
.day{min-height:54px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
.day.sun b{color:var(--ot)}.day.today{background:var(--card);border-color:var(--a)}.day.sel{outline:3px solid var(--a)}.day.x{visibility:hidden}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}.dots i{width:9px;height:9px;border-radius:50%}
.dots i.x{width:6px;height:6px;border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:2px solid var(--c);border-radius:20px;padding:5px 12px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600}.chip.on{background:var(--c);color:#fff}
.tag{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--c);border-radius:20px;padding:1px 10px;font-size:13px}
.shs{display:flex;gap:8px;margin:6px 0}
.shbtn{flex:1;padding:9px 4px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-weight:600}.shbtn.on{background:var(--a);color:var(--on-a);border-color:var(--a)}
.save{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;color:#fff;font:inherit;font-weight:800;font-size:17px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.dot{width:10px;align-self:stretch;border-radius:5px;flex:none}.item .m{flex:1;min-width:0}.item .m span{color:var(--mute);font-size:13px}
.ot{color:var(--ot);font-weight:600;font-style:normal}
.del{border:0;background:none;color:var(--mute);font:inherit;font-size:16px;padding:6px 10px}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.top h1{flex:1;min-width:0}
.menu{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:20px;padding:2px 12px}
.menu-p{padding:0;overflow:hidden}
.day.cl{min-height:70px;padding:4px 1px;color:var(--ink);gap:2px}
.day .lb{font-size:13px;font-weight:700;line-height:1.1}
.pls{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
i.pl{font-style:normal;font-size:9px;line-height:1.25;padding:1px 4px;border-radius:6px;color:#fff;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:flex-start}
.sheet{background:var(--card);color:var(--ink);border-radius:16px;padding:14px;width:100%;max-width:520px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.pb{min-height:46px;border:3px solid transparent;border-radius:10px;color:var(--ink);font:inherit;font-weight:700;padding:4px}
.pb small{font-weight:500;opacity:.75}
.pb.on{border-color:var(--c)}
.gt{font-size:12px;color:var(--mute);margin:10px 0 0;text-transform:uppercase;letter-spacing:.04em}
.gear{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:18px;line-height:1;padding:7px 11px}.gear.on{background:var(--a);color:var(--on-a);border-color:var(--a)}
.gross{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gross.hold::after{content:"";position:absolute;left:0;bottom:0;height:5px;background:var(--a);width:0;animation:gfill .7s linear forwards}
@keyframes gfill{to{width:100%}}
.mi{display:block;width:100%;text-align:left;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:600}.mi.on{color:var(--a)}
.del.red{background:#c0392b;color:#fff;border-radius:8px}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#17202b;color:#fff;padding:12px 14px;border-radius:12px;z-index:9;text-align:center}
</style></head><body><main id="app"></main><div id="toast" role="status"></div>
